<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0a253b" />
      <stop offset="55%" stop-color="#04101c" />
      <stop offset="100%" stop-color="#010509" />
    </radialGradient>
    <linearGradient id="ringCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#ringCyan)" stroke-width="3" stroke-opacity="0.35" />

  <!-- Outer Precision Holographic Ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#ringCyan)" stroke-width="3" stroke-dasharray="18 14 6 14" opacity="0.55" />

  <!-- Second Segmented Ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ringCyan)" stroke-width="5" stroke-dasharray="95 55 30 55" stroke-linecap="round" filter="url(#glow)" opacity="0.85" />

  <!-- Inner Gold Tactical Ring -->
  <circle cx="256" cy="256" r="138" fill="none" stroke="url(#goldAccent)" stroke-width="3.5" stroke-dasharray="6 14" stroke-linecap="round" opacity="0.8" />

  <!-- Core Energy Sphere -->
  <circle cx="256" cy="256" r="112" fill="#030d17" stroke="url(#ringCyan)" stroke-width="4" filter="url(#glow)" />
  <circle cx="256" cy="256" r="98" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Stylized 'M' Emblem + Voice Wave inside Core -->
  <path d="M198 292 V214 L256 266 L314 214 V292" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Top & Bottom Energy Nodes -->
  <circle cx="256" cy="60" r="6" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="256" cy="452" r="6" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="60" cy="256" r="6" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="452" cy="256" r="6" fill="#fbbf24" filter="url(#glow)" />
</svg>
